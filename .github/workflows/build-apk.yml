name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'app/Figma Bestanden/package-lock.json'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install npm dependencies
      working-directory: app/Figma Bestanden
      run: npm install

    - name: Build web app
      working-directory: app/Figma Bestanden
      run: npm run build

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli

    - name: Initialize Capacitor (first time)
      working-directory: app/Figma Bestanden
      run: |
        if [ ! -d "android" ]; then
          npx cap init --webDir dist
        fi

    - name: Add Android platform
      working-directory: app/Figma Bestanden
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Sync Capacitor
      working-directory: app/Figma Bestanden
      run: npx cap sync

    - name: Build Android APK (Debug)
      working-directory: app/Figma Bestanden/android
      run: ./gradlew assembleDebug

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ecolux-debug-apk
        path: app/Figma Bestanden/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Build Android APK (Release)
      working-directory: app/Figma Bestanden/android
      run: ./gradlew assembleRelease || true

    - name: Upload Release APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ecolux-release-apk
        path: app/Figma Bestanden/android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 7
      continue-on-error: true

    - name: Create Release Notes
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "✅ EcoLux APK Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📱 Download APKs:" >> $GITHUB_STEP_SUMMARY
        echo "- Debug APK: Available in Artifacts (for testing)" >> $GITHUB_STEP_SUMMARY
        echo "- Release APK: Available in Artifacts (for production)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- Date: $(date)" >> $GITHUB_STEP_SUMMARY
