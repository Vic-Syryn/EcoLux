<svg width="680" height="1880" viewBox="0 0 680 1880" xmlns="http://www.w3.org/2000/svg" role="img">
<title>EcoLux methodology, October to June</title>
<desc>A schematic timeline showing the double-diamond Discover and Define phases followed by four iterative Develop cycles, with activities, design artefacts and knowledge templates per stage, running October through June.</desc>

<style>
  .bg { fill: #0d1117; }
  .t  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #e6edf3; }
  .ts { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #9da7b3; }
  .th { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
  .spine { stroke: #30363d; stroke-width: 1; stroke-dasharray: 2 6; }
  .conn  { stroke: #484f58; stroke-width: 1; fill: none; }
  .divider { stroke: #ffffff; stroke-opacity: 0.12; stroke-width: 1; }

  .purple { fill: #2a2456; stroke: #7f77dd; }
  .purpleTitle { fill: #cecbf6; }

  .coral { fill: #3a2017; stroke: #d85a30; }
  .coralTitle { fill: #f5c4b3; }

  .amber { fill: #3a2c10; stroke: #ef9f27; }
  .amberTitle { fill: #fac775; }

  .teal { fill: #103027; stroke: #1d9e75; }
  .tealTitle { fill: #9fe1cb; }

  .loop { stroke: #484f58; stroke-width: 1; stroke-dasharray: 3 5; fill: none; }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
